<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <style>
    body {
      width: 300px;
      margin: 0;
      padding: 16px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }

    h1 {
      font-size: 16px;
      margin: 0 0 4px 0;
      color: #4ade80;
    }

    .subtitle {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 14px;
    }

    .control {
      margin-top: 12px;
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 4px;
      color: #cbd5e1;
    }

    select {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #f8fafc;
      font-size: 12px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #22c55e;
    }

    button {
      width: 100%;
      margin-top: 14px;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    button.start {
      background: #15803d;
      color: #fff;
    }

    button.start:hover {
      background: #166534;
    }

    button.stop {
      background: #dc2626;
      color: #fff;
    }

    button.stop:hover {
      background: #b91c1c;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .status {
      margin-top: 12px;
      padding: 8px 10px;
      border-radius: 6px;
      background: #1e293b;
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.4;
    }

    .status.error {
      color: #fca5a5;
      background: #450a0a;
    }
  </style>
</head>

<body>
  <h1>Music Remover</h1>
  <div class="subtitle">100% Browser · WebGPU / WASM ONNX</div>

  <div class="control" style="margin-top: 0;">
    <div class="label-row">
      <span>Model Engine</span>
    </div>
    <select id="engineSelect">
      <option value="kimvocal">Kim Vocal 2 (44.1kHz · FP32, ~64 MB)</option>
      <option value="kimvocal_fp16">Kim Vocal 2 FP16 (44.1kHz · FP16, ~32 MB)</option>
      <option value="vocft">UVR-MDX-NET Voc_FT (44.1kHz · FP32, ~64 MB)</option>
      <option value="gtcrn">GTCRN (16kHz · 523 KB)</option>
    </select>
  </div>

  <div class="control">
    <div class="label-row">
      <span>Mode Eksekusi</span>
    </div>
    <select id="backendSelect">
      <option value="webgpu" selected>WebGPU + Fallback WASM (GPU / CPU)</option>
      <option value="wasm">WebAssembly (CPU)</option>
    </select>
  </div>

  <div id="delayControl" class="control">
    <div class="label-row">
      <span>Chunk Delay</span>
      <span id="delayVal">5.5 s</span>
    </div>
    <input id="delaySlider" type="range" min="1.5" max="5.9" step="0.5" value="5.5" />
  </div>

  <div class="control">
    <div class="label-row">
      <span>Filter Strength</span>
      <span id="strengthVal">100%</span>
    </div>
    <input id="strengthSlider" type="range" min="0" max="100" value="100" />
  </div>

  <button id="toggleBtn" class="start">Start on This Tab</button>

  <div id="statusBox" class="status">Idle — pilih model dan klik Start.</div>

  <script src="popup.js"></script>
</body>

</html>
